const METALS = [
  { symbol: 'K', name: 'Potassium', reactsFrom: 'water' },
  { symbol: 'Na', name: 'Sodium', reactsFrom: 'water' },
  { symbol: 'Ca', name: 'Calcium', reactsFrom: 'water' },
  { symbol: 'Mg', name: 'Magnesium', reactsFrom: 'water' },
  { symbol: 'Zn', name: 'Zinc', reactsFrom: 'steam' },
  { symbol: 'Fe', name: 'Iron', reactsFrom: 'steam' },
  { symbol: 'Pb', name: 'Lead', reactsFrom: 'acid' },

const REAGENT_TIER = { water: 0, steam: 1, acid: 2 };

const REAGENTS = {
  water: { label: 'Cold Water', short: 'H₂O · cold', color: COLORS.water, Icon: Droplet },

const QUESTIONS = [
  { metal: 'K', reagent: 'water', reacts: true, equation: '2K + 2H{2}O → 2KOH + H{2}',
    distractors: ['K + H{2}O → KOH + H{2}', '2K + 2H{2}O → 2KOH + 2H{2}'],

  { metal: 'Ca', reagent: 'water', reacts: true, equation: 'Ca + 2H{2}O → Ca(OH){2} + H{2}',

  { metal: 'Mg', reagent: 'acid', reacts: true, equation: 'Mg + 2HCl → MgCl{2} + H{2}',

    note: 'One of the most vigorous acid reactions here — rapid fizzing and a warm test tube.' },
  { metal: 'Zn', reagent: 'water', reacts: false,

  { metal: 'Zn', reagent: 'acid', reacts: true, equation: 'Zn + 2HCl → ZnCl{2} + H{2}',

  { metal: 'Fe', reagent: 'water', reacts: false,

  { metal: 'Fe', reagent: 'steam', reacts: true, equation: '3Fe + 4H{2}O → Fe{3}O{4} + 4H{2}',

  { metal: 'Cu', reagent: 'water', reacts: false,

  { metal: 'Cu', reagent: 'steam', reacts: false,

  { metal: 'Cu', reagent: 'acid', reacts: false,

  { metal: 'Ag', reagent: 'water', reacts: false,
    note: 'No reaction — silver is even less reactive than copper.' },
  { metal: 'Ag', reagent: 'steam', reacts: false,
    note: 'No reaction — steam leaves silver completely unaffected.' },
  { metal: 'Ag', reagent: 'acid', reacts: false,

  { metal: 'Au', reagent: 'water', reacts: false,
    note: 'No reaction — gold is the least reactive metal on this list.' },
  { metal: 'Au', reagent: 'steam', reacts: false,
    note: 'No reaction — gold resists steam entirely.' },
  { metal: 'Au', reagent: 'acid', reacts: false,
    note: 'No reaction — not even dilute acid touches gold; only special mixtures like aqua regia can dissolve it.' },

const VOCAB_QUESTIONS = [

  { reagent: 'steam', vigor: 'violently', answer: 'Magnesium', distractors: ['Zinc', 'Iron', 'Calcium'],

  { reagent: 'steam', vigor: 'readily', answer: 'Zinc', distractors: ['Magnesium', 'Iron', 'Lead'],

  { reagent: 'steam', vigor: 'slowly', answer: 'Iron', distractors: ['Zinc', 'Magnesium', 'Lead'],

  { reagent: 'acid', vigor: 'explosively', answer: 'Potassium & Sodium', distractors: ['Calcium', 'Magnesium', 'Zinc'],

  { reagent: 'acid', vigor: 'violently', answer: 'Calcium', distractors: ['Magnesium', 'Zinc', 'Iron'],

  { reagent: 'acid', vigor: 'rapidly', answer: 'Magnesium', distractors: ['Calcium', 'Zinc', 'Iron'],

  { reagent: 'acid', vigor: 'moderately fast', answer: 'Zinc', distractors: ['Magnesium', 'Iron', 'Lead'],

const ALL_QUESTIONS = [
  ...QUESTIONS.map((q) => ({ ...q, kind: 'reaction' })),
  ...VOCAB_QUESTIONS.map((q) => ({ ...q, kind: 'vocab' })),
];

function formatFormula(str) {
  const parts = str.split(/\{(\d+)\}/);
  return parts.map((part, i) =>
    i % 2 === 1 ? <sub key={i}>{part}</sub> : <span key={i}>{part}</span>
  );
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function metalOf(symbol) {
  return METALS.find((m) => m.symbol === symbol);
}

function ReactivityGauge({ activeSymbol }) {
  return (
    <div className="flex flex-col items-center gap-1.5 py-2 px-1 shrink-0">
      <ArrowUp className="w-3 h-3" style={{ color: COLORS.signal }} />
      <span
        className="text-[8px] tracking-widest mb-1 select-none"
        style={{ writingMode: 'vertical-rl', color: COLORS.signal, fontFamily: DISPLAY_FONT }}
      >
        MORE REACTIVE
      </span>
      {METALS.map((m) => {
        const active = m.symbol === activeSymbol;
        return (
          <div
            key={m.symbol}
            className="w-8 h-8 sm:w-9 sm:h-9 rounded-sm flex items-center justify-center text-[10px] sm:text-[11px] font-semibold border transition-all duration-300 motion-reduce:transition-none"
            style={{
              fontFamily: MONO_FONT,
              backgroundColor: active ? COLORS.signal : COLORS.panel,
              borderColor: active ? COLORS.signal : COLORS.panelLine,
              color: active ? '#fff' : `${COLORS.steel}99`,
              transform: active ? 'scale(1.12)' : 'scale(1)',
              boxShadow: active ? `0 0 12px ${COLORS.signal}` : 'none',
            }}
          >
            {m.symbol}
          </div>
        );
      })}
    </div>
  );
}

function RecapTable() {
  const cell = (metal, reagentId) => {
    const reacts = metal.reactsFrom !== 'none' && REAGENT_TIER[reagentId] >= REAGENT_TIER[metal.reactsFrom];
    return reacts ? (
      <div
        className="w-full h-full flex items-center justify-center rounded-sm"
        style={{ backgroundColor: `${COLORS.signal}33`, border: `1px solid ${COLORS.signal}` }}
      >
        <Check className="w-3.5 h-3.5" style={{ color: COLORS.signal }} />
      </div>
    ) : (
      <Minus className="w-3 h-3 mx-auto opacity-20" />
    );
  };
  return (
    <div className="w-full overflow-x-auto">
      <table className="w-full border-collapse text-[10px] sm:text-xs">
        <thead>
          <tr>
            <th className="text-left font-normal pb-1.5" style={{ color: `${COLORS.steel}99` }}></th>
            {['water', 'steam', 'acid'].map((r) => (
              <th key={r} className="pb-1.5 font-medium whitespace-nowrap" style={{ color: REAGENTS[r].color, fontFamily: DISPLAY_FONT }}>
                {REAGENTS[r].label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {METALS.map((m) => (
            <tr key={m.symbol} className="border-t" style={{ borderColor: COLORS.panelLine }}>
              <td className="py-1.5 pr-3 font-medium whitespace-nowrap" style={{ color: COLORS.steel }}>
                {m.name} <span style={{ fontFamily: MONO_FONT, color: `${COLORS.steel}99` }}>({m.symbol})</span>
              </td>
              {['water', 'steam', 'acid'].map((r) => (
                <td key={r} className="py-1.5 px-1 h-7">
                  {cell(m, r)}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function useAudio() {
  const ctxRef = useRef(null);

  function getCtx() {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctxRef.current = new AC();
    }
    if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }

  function playTone(freq, start, duration, type, gainPeak) {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  function playCorrect() {
    playTone(523.25, 0, 0.14, 'sine', 0.16);
    playTone(659.25, 0.08, 0.14, 'sine', 0.16);
    playTone(783.99, 0.16, 0.22, 'sine', 0.16);
  }

  function playWrong() {
    playTone(196.0, 0, 0.22, 'triangle', 0.14);
    playTone(146.83, 0.12, 0.3, 'triangle', 0.14);
  }

  return { playCorrect, playWrong };
}

function ReactivityRumble() {
  const [phase, setPhase] = useState('start');
  const [deck, setDeck] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [predicted, setPredicted] = useState(null);
  const [mcqChoice, setMcqChoice] = useState(null);
  const [mcqOptions, setMcqOptions] = useState([]);
  const [vocabChoice, setVocabChoice] = useState(null);
  const [vocabOptions, setVocabOptions] = useState([]);
  const [lastCorrect, setLastCorrect] = useState(null);
  const [muted, setMuted] = useState(false);
  const [hearts, setHearts] = useState(3);
  const [target, setTarget] = useState(10);
  const audio = useAudio();

  function toggleSound() {
    setMuted((m) => !m);
  }

  const currentQ = deck[qIndex];

  function beginRound(q) {
    if (q.kind === 'vocab') {
      setVocabOptions(shuffle([q.answer, ...q.distractors]));
      setPhase('vocab-choice');
    } else {
      setPhase('predicting');
    }
  }

  function startGame() {
    const shuffled = shuffle(ALL_QUESTIONS);
    setDeck(shuffled);
    setQIndex(0);
    setScore(0);
    setStreak(0);
    setBestStreak(0);
    setHearts(3);
    setTarget(10);
    setPredicted(null);
    setMcqChoice(null);
    setVocabChoice(null);
    beginRound(shuffled[0]);
  }

  function bumpStreak() {
    setStreak((s) => {
      const n = s + 1;
      setBestStreak((b) => Math.max(b, n));
      return n;
    });
  }

  function onCorrect() {
    bumpStreak();
    if (!muted) audio.playCorrect();
  }

  function onWrong() {
    setStreak(0);
    if (!muted) audio.playWrong();
    setHearts((h) => {
      const next = h - 1;
      if (next <= 0) {
        setTarget((t) => Math.min(t + 5, ALL_QUESTIONS.length));
        return 3;
      }
      return next;
    });
  }

  function handlePredict(choice) {
    setPredicted(choice);
    if (currentQ.reacts && choice === 'react') {
      setMcqOptions(shuffle([currentQ.equation, ...currentQ.distractors]));
      setScore((s) => s + 10);
      if (!muted) audio.playCorrect();
      setPhase('mcq');
      return;
    }
    const correct = (choice === 'react') === currentQ.reacts;
    if (correct) {
      setScore((s) => s + 10);
      onCorrect();
    } else {
      onWrong();
    }
    setLastCorrect(correct);
    setPhase('feedback');
  }

  function handleMcq(choice) {
    setMcqChoice(choice);
    const correct = choice === currentQ.equation;
    if (correct) {
      setScore((s) => s + 15);
      onCorrect();
    } else {
      onWrong();
    }
    setLastCorrect(correct);
    setPhase('feedback');
  }

  function handleVocab(choice) {
    setVocabChoice(choice);
    const correct = choice === currentQ.answer;
    if (correct) {
      setScore((s) => s + 15);
      onCorrect();
    } else {
      onWrong();
    }
    setLastCorrect(correct);
    setPhase('feedback');
  }

  function nextQuestion() {
    const playedCount = qIndex + 1;
    const done = streak >= 5 || playedCount >= target || playedCount >= deck.length;
    if (done) {
      setPhase('summary');
    } else {
      const nextIdx = playedCount;
      setQIndex(nextIdx);
      setPredicted(null);
      setMcqChoice(null);
      setMcqOptions([]);
      setVocabChoice(null);
      setVocabOptions([]);
      beginRound(deck[nextIdx]);
    }
  }

  const questionsPlayed = qIndex + 1;
  const sessionMax = deck.length
    ? deck.slice(0, questionsPlayed).reduce((sum, q) => sum + (q.kind === 'vocab' ? 15 : q.reacts ? 25 : 10), 0)
    : 0;

  let title = 'Keep Practising';
  let endNote = '';
  if (phase === 'summary' && sessionMax > 0) {
    const pct = score / sessionMax;
    if (pct >= 0.9) title = 'Reactivity Rumble Champion';
    else if (pct >= 0.7) title = 'Lab Veteran';
    else if (pct >= 0.5) title = 'Reactivity Rookie';

    if (streak >= 5) endNote = 'Finished early on a 5-question streak!';
    else if (questionsPlayed >= deck.length) endNote = 'Cleared the entire question pool!';
    else endNote = `Reached the goal of ${target} questions.`;
  }

  const reagentInfo = currentQ ? REAGENTS[currentQ.reagent] : null;
  const metalInfo = currentQ && currentQ.kind === 'reaction' ? metalOf(currentQ.metal) : null;
  const willEnd = streak >= 5 || qIndex + 1 >= target || qIndex + 1 >= deck.length;

  return (
    <div className="min-h-screen w-full flex flex-col" style={{ backgroundColor: COLORS.bg, color: COLORS.steel }}>
      <style>{FONT_IMPORT}</style>

      <header className="flex items-center justify-between px-4 pt-4 pb-3 border-b" style={{ borderColor: COLORS.panelLine }}>
        <div>
          <h1 className="text-lg sm:text-xl font-bold tracking-wide" style={{ fontFamily: DISPLAY_FONT }}>
            REACTIVITY RUMBLE
          </h1>
          <p className="text-[10px] tracking-widest uppercase" style={{ color: `${COLORS.steel}80` }}>
            Equation Edition
          </p>
        </div>
        <div className="flex items-center gap-3 text-xs sm:text-sm">
          {phase !== 'start' && (
            <>
              <div className="flex items-center gap-0.5">
                {[0, 1, 2].map((i) => (
                  <Heart
                    key={i}
                    className="w-3.5 h-3.5"
                    style={{
                      color: COLORS.signal,
                      fill: i < hearts ? COLORS.signal : 'none',
                      opacity: i < hearts ? 1 : 0.35,
                    }}
                  />
                ))}
              </div>
              <div className="flex items-center gap-1" style={{ color: streak >= 3 ? COLORS.steam : COLORS.steel }}>
                <Zap className="w-4 h-4" />
                <span style={{ fontFamily: MONO_FONT }}>{streak}</span>
              </div>
              <div className="flex items-center gap-1">
                <Trophy className="w-4 h-4" style={{ color: COLORS.acid }} />
                <span style={{ fontFamily: MONO_FONT }}>{score}</span>
              </div>
            </>
          )}
          <button
            onClick={toggleSound}
            aria-label={muted ? 'Unmute sound' : 'Mute sound'}
            className="p-1 rounded-sm transition-transform active:scale-90 motion-reduce:transition-none"
            style={{ color: `${COLORS.steel}99` }}
          >
            {muted ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
          </button>
        </div>
      </header>

      <div className="flex flex-1 min-h-0">
        {phase === 'predicting' || phase === 'mcq' || phase === 'vocab-choice' || phase === 'feedback' ? (
          <ReactivityGauge activeSymbol={currentQ?.kind === 'reaction' ? currentQ.metal : undefined} />
        ) : null}

        <main className="flex-1 flex flex-col items-center px-4 py-6 overflow-y-auto">
          {phase === 'start' && (
            <div className="max-w-sm w-full flex flex-col items-center text-center gap-6 mt-6">
              <div className="w-full rounded-md p-5" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                <p className="text-sm leading-relaxed" style={{ color: `${COLORS.steel}CC` }}>
                  10 metals. 3 reagents. 40 questions in the pool, shuffled fresh each run.
                  Answer 10 correctly to finish, or nail a 5-streak to finish early.
                  You've got 3 hearts — lose all 3 and the goal grows by 5 more questions.
                </p>
                <div className="flex justify-center gap-4 mt-4 text-[11px]" style={{ color: `${COLORS.steel}80` }}>
                  <span>K · Na · Ca · Mg</span>
                  <span style={{ color: COLORS.panelLine }}>|</span>
                  <span>Zn · Fe · Pb</span>
                  <span style={{ color: COLORS.panelLine }}>|</span>
                  <span>Cu · Ag · Au</span>
                </div>
              </div>
              <div className="flex flex-col gap-2 w-full">
                <button
                  onClick={startGame}
                  className="flex items-center justify-center gap-2 px-6 py-3 rounded-sm font-semibold text-sm tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                  style={{ backgroundColor: COLORS.signal, color: '#fff', fontFamily: DISPLAY_FONT }}
                >
                  <Play className="w-4 h-4" /> START RUMBLE
                </button>
                <button
                  onClick={() => setPhase('reference')}
                  className="flex items-center justify-center gap-2 px-6 py-2.5 rounded-sm font-medium text-xs tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                  style={{ backgroundColor: 'transparent', border: `1px solid ${COLORS.panelLine}`, color: `${COLORS.steel}CC`, fontFamily: DISPLAY_FONT }}
                >
                  VIEW SUMMARY
                </button>
              </div>
            </div>
          )}

          {phase === 'reference' && (
            <div className="w-full max-w-sm flex flex-col items-center gap-4 mt-4">
              <div className="text-center">
                <div className="text-base font-bold tracking-wide" style={{ fontFamily: DISPLAY_FONT }}>REACTIVITY SUMMARY</div>
                <div className="text-[10px] mt-1 tracking-widest" style={{ color: `${COLORS.steel}66` }}>
                  10 METALS · 3 REAGENTS
                </div>
              </div>
              <div className="w-full rounded-md p-3" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                <RecapTable />
              </div>
              <p className="text-xs text-center leading-relaxed" style={{ color: `${COLORS.steel}80` }}>
                K, Na, Ca, Mg react with cold water. Zn and Fe need steam. Pb reacts only with acid.
                Cu, Ag and Au sit below hydrogen — no reaction with any of the three.
              </p>
              <button
                onClick={() => setPhase('start')}
                className="px-6 py-2.5 rounded-sm font-medium text-xs tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                style={{ backgroundColor: 'transparent', border: `1px solid ${COLORS.panelLine}`, color: `${COLORS.steel}CC`, fontFamily: DISPLAY_FONT }}
              >
                BACK
              </button>
            </div>
          )}

          {currentQ && currentQ.kind === 'reaction' && (phase === 'predicting' || phase === 'mcq' || phase === 'feedback') && (
            <div className="w-full max-w-sm flex flex-col gap-4">
              <div className="text-center text-[10px] tracking-widest" style={{ color: `${COLORS.steel}66` }}>
                MATCHUP {qIndex + 1} / {target}
              </div>

              <div className="rounded-md p-4 flex items-center justify-between" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                <div className="text-center flex-1">
                  <div className="text-2xl font-bold" style={{ fontFamily: MONO_FONT }}>{metalInfo.symbol}</div>
                  <div className="text-[10px]" style={{ color: `${COLORS.steel}80` }}>{metalInfo.name}</div>
                </div>
                <div className="text-xs font-semibold px-2" style={{ color: `${COLORS.steel}55`, fontFamily: DISPLAY_FONT }}>VS</div>
                <div className="text-center flex-1">
                  <reagentInfo.Icon className="w-6 h-6 mx-auto mb-1" style={{ color: reagentInfo.color }} />
                  <div className="text-[10px]" style={{ color: `${COLORS.steel}80` }}>{reagentInfo.label}</div>
                </div>
              </div>

              {phase === 'predicting' && (
                <div className="flex flex-col gap-2">
                  <p className="text-center text-sm" style={{ color: `${COLORS.steel}CC` }}>
                    Does {metalInfo.name.toLowerCase()} react with {reagentInfo.label.toLowerCase()}?
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => handlePredict('react')}
                      className="py-3 rounded-sm text-sm font-semibold transition-transform active:scale-95 motion-reduce:transition-none"
                      style={{ backgroundColor: `${COLORS.signal}22`, border: `1px solid ${COLORS.signal}`, color: COLORS.signal }}
                    >
                      REACTS
                    </button>
                    <button
                      onClick={() => handlePredict('no')}
                      className="py-3 rounded-sm text-sm font-semibold transition-transform active:scale-95 motion-reduce:transition-none"
                      style={{ backgroundColor: 'transparent', border: `1px solid ${COLORS.panelLine}`, color: `${COLORS.steel}CC` }}
                    >
                      NO REACTION
                    </button>
                  </div>
                </div>
              )}

              {phase === 'mcq' && (
                <div className="flex flex-col gap-2">
                  <p className="text-center text-sm" style={{ color: `${COLORS.steel}CC` }}>
                    Correct — now pick the balanced equation:
                  </p>
                  {mcqOptions.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => handleMcq(opt)}
                      className="text-left px-3 py-2.5 rounded-sm text-sm transition-transform active:scale-[0.98] motion-reduce:transition-none"
                      style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}`, fontFamily: MONO_FONT }}
                    >
                      {formatFormula(opt)}
                    </button>
                  ))}
                </div>
              )}

              {phase === 'feedback' && (
                <div className="flex flex-col gap-3">
                  <div
                    className="flex items-center gap-2 justify-center py-2 rounded-sm text-sm font-semibold"
                    style={{
                      color: lastCorrect ? COLORS.acid : COLORS.signal,
                      backgroundColor: lastCorrect ? `${COLORS.acid}18` : `${COLORS.signal}18`,
                    }}
                  >
                    {lastCorrect ? <CheckCircle2 className="w-4 h-4" /> : <XCircle className="w-4 h-4" />}
                    {lastCorrect ? 'Correct' : 'Not quite'}
                  </div>

                  {currentQ.reacts ? (
                    <div className="rounded-sm px-3 py-3 text-center text-sm" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}`, fontFamily: MONO_FONT }}>
                      {formatFormula(currentQ.equation)}
                    </div>
                  ) : (
                    <div className="rounded-sm px-3 py-3 text-center text-sm font-medium" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                      No reaction
                    </div>
                  )}

                  <p className="text-xs leading-relaxed text-center" style={{ color: `${COLORS.steel}99` }}>
                    {currentQ.note}
                  </p>

                  <button
                    onClick={nextQuestion}
                    className="py-3 rounded-sm text-sm font-semibold tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                    style={{ backgroundColor: COLORS.signal, color: '#fff', fontFamily: DISPLAY_FONT }}
                  >
                    {willEnd ? 'SEE RESULTS' : 'NEXT MATCHUP'}
                  </button>
                </div>
              )}
            </div>
          )}

          {currentQ && currentQ.kind === 'vocab' && (phase === 'vocab-choice' || phase === 'feedback') && (
            <div className="w-full max-w-sm flex flex-col gap-4">
              <div className="text-center text-[10px] tracking-widest" style={{ color: `${COLORS.steel}66` }}>
                MATCHUP {qIndex + 1} / {target}
              </div>

              <div className="rounded-md p-4 flex flex-col items-center gap-1" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                <reagentInfo.Icon className="w-6 h-6 mb-1" style={{ color: reagentInfo.color }} />
                <div className="text-[10px] tracking-widest uppercase" style={{ color: `${COLORS.steel}80` }}>{reagentInfo.label}</div>
                <div className="text-base font-semibold mt-1" style={{ fontFamily: DISPLAY_FONT }}>
                  "reacts {currentQ.vigor}"
                </div>
              </div>

              {phase === 'vocab-choice' && (
                <div className="flex flex-col gap-2">
                  <p className="text-center text-sm" style={{ color: `${COLORS.steel}CC` }}>
                    Which metal(s) fit that description?
                  </p>
                  {vocabOptions.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => handleVocab(opt)}
                      className="text-left px-3 py-2.5 rounded-sm text-sm font-medium transition-transform active:scale-[0.98] motion-reduce:transition-none"
                      style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              )}

              {phase === 'feedback' && (
                <div className="flex flex-col gap-3">
                  <div
                    className="flex items-center gap-2 justify-center py-2 rounded-sm text-sm font-semibold"
                    style={{
                      color: lastCorrect ? COLORS.acid : COLORS.signal,
                      backgroundColor: lastCorrect ? `${COLORS.acid}18` : `${COLORS.signal}18`,
                    }}
                  >
                    {lastCorrect ? <CheckCircle2 className="w-4 h-4" /> : <XCircle className="w-4 h-4" />}
                    {lastCorrect ? 'Correct' : 'Not quite'}
                  </div>

                  <div className="rounded-sm px-3 py-3 text-center text-sm font-medium" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                    {currentQ.answer}
                  </div>

                  <p className="text-xs leading-relaxed text-center" style={{ color: `${COLORS.steel}99` }}>
                    {currentQ.note}
                  </p>

                  <button
                    onClick={nextQuestion}
                    className="py-3 rounded-sm text-sm font-semibold tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                    style={{ backgroundColor: COLORS.signal, color: '#fff', fontFamily: DISPLAY_FONT }}
                  >
                    {willEnd ? 'SEE RESULTS' : 'NEXT MATCHUP'}
                  </button>
                </div>
              )}
            </div>
          )}

          {phase === 'summary' && (
            <div className="w-full max-w-sm flex flex-col items-center gap-5 mt-4">
              <Trophy className="w-9 h-9" style={{ color: COLORS.acid }} />
              <div className="text-center">
                <div className="text-lg font-bold tracking-wide" style={{ fontFamily: DISPLAY_FONT }}>{title}</div>
                <div className="text-xs mt-1" style={{ color: `${COLORS.steel}80` }}>
                  {score} / {sessionMax} pts · best streak {bestStreak}
                </div>
                {endNote && (
                  <div className="text-[11px] mt-1" style={{ color: `${COLORS.steel}66` }}>{endNote}</div>
                )}
              </div>

              <div className="w-full rounded-md p-3" style={{ backgroundColor: COLORS.panel, border: `1px solid ${COLORS.panelLine}` }}>
                <div className="text-[10px] tracking-widest text-center mb-2" style={{ color: `${COLORS.steel}66` }}>
                  QUICK REFERENCE
                </div>
                <RecapTable />
              </div>

              <button
                onClick={startGame}
                className="flex items-center gap-2 px-6 py-3 rounded-sm font-semibold text-sm tracking-wide transition-transform active:scale-95 motion-reduce:transition-none"
                style={{ backgroundColor: COLORS.signal, color: '#fff', fontFamily: DISPLAY_FONT }}
              >
                <RotateCcw className="w-4 h-4" /> PLAY AGAIN
              </button>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ReactivityRumble />);


</script>
</body>
</html>
